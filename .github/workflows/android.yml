name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # 自用软件：版本号固定，靠构建时间戳区分版本（versionCode = 构建时刻秒，单调递增）
  APP_VERSION: '0.1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate version info
        id: version
        run: |
          export TZ=Asia/Shanghai
          VERSION_CODE=$(date +%s)
          BUILD_TIME=$(date +%Y%m%d%H%M%S)
          TAG="v${APP_VERSION}-${BUILD_TIME}"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "display=${BUILD_TIME:0:8} ${BUILD_TIME:8:6}" >> "$GITHUB_OUTPUT"
          echo "Generated ${TAG} (versionCode: ${VERSION_CODE})"

      - name: Build debug APK (pull request)
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact (pull request)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lightcopy-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Decode signing keystore
        id: keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/lightcopy-release.jks
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，本次 APK 将使用 debug 签名，无法覆盖安装正式签名版本。"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: github.event_name != 'pull_request'
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ env.APP_VERSION }}
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signing cert
        if: github.event_name != 'pull_request'
        # keytool -printcert -jarfile 只认 v1 JAR 签名（minSdk 26+ 默认仅 v2/v3，会误报
        # "Not a signed jar file"），必须用 apksigner 验证真实签名指纹
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare release assets
        if: github.event_name != 'pull_request'
        id: assets
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DISPLAY: ${{ steps.version.outputs.display }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          APK_NAME="lightcopy-${TAG}.apk"
          CHECKSUM_NAME="${APK_NAME}.sha256"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$CHECKSUM_NAME"

          GITHUB_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          PROXY_URL="https://gh-proxy.com/${GITHUB_URL}"

          cat > release-notes.md <<EOF
          ## 版本

          - 版本：${APP_VERSION} (${DISPLAY}) · versionCode ${{ steps.version.outputs.code }}

          ## 本次变更

          \`\`\`
          ${COMMIT_MSG}
          \`\`\`

          ## 下载

          - [国内加速下载](${PROXY_URL})
          - [GitHub 原始下载](${GITHUB_URL})

          ## 文件校验

          - 文件：\`${APK_NAME}\`
          - SHA-256：见 \`${CHECKSUM_NAME}\`
          EOF

          echo "apk=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "checksum=${CHECKSUM_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            lightcopy-"$TAG".apk lightcopy-"$TAG".apk.sha256

      - name: Cleanup old releases (keep 10)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 仅清理时间戳格式的自动发版 tag
          mapfile -t RELEASES < <(gh release list --limit 100 --json tagName,createdAt \
            --jq '.[] | select(.tagName | test("^v[0-9.]+-[0-9]{14}$")) | "\(.createdAt) \(.tagName)"' | sort -r)
          TOTAL=${#RELEASES[@]}
          echo "Found $TOTAL auto releases; keeping 10"
          for ((i=10; i<TOTAL; i++)); do
            OLD_TAG=$(echo "${RELEASES[$i]}" | awk '{print $2}')
            echo "Deleting release and tag: $OLD_TAG"
            gh release delete "$OLD_TAG" --yes --cleanup-tag || echo "Failed to delete $OLD_TAG"
          done
